name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, APK
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit tests (crypto vectors, handshake, FSK loopback)
        run: ./gradlew :composeApp:testDebugUnitTest --console=plain

      - name: Lint (must be 0 errors)
        run: ./gradlew :composeApp:lintDebug --console=plain

      - name: Assemble debug + release
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleRelease --console=plain

      - name: iOS target compiles
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wavetone-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
